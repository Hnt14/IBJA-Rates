name: Update IBJA rates
on:
  schedule:
    # IBJA shows PM rates ~5:05 PM IST. Run 6:15 PM IST (12:45 UTC) Mon-Fri, plus a midday run for AM rates.
    - cron: "45 12 * * 1-5"
    - cron: "45 6 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scrape.py
      - name: Commit updated rates
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet || git commit -m "Update IBJA rates"
          git push
