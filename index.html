<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IBJA Rates">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>IBJA Gold &amp; Silver</title>
<style>
:root{
  --bg:#14110c; --card:#1e1a13; --line:#322b1e; --text:#f3ecdd; --mute:#a39a86;
  --gold:#e0b341; --silver:#c3c8cf; --up:#6fcf8c; --down:#ef7d6b;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f7f3ea; --card:#fffdf8; --line:#e6dfce; --text:#231d10; --mute:#7a705c;
         --gold:#a87800; --silver:#5d6570; --up:#1f8a45; --down:#c0442f; }
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
h1{font-size:18px;font-weight:650;letter-spacing:.2px}
.sub{font-size:13px;color:var(--mute)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:6px 14px;border-radius:8px;min-height:32px}
.seg button[aria-pressed=true]{background:var(--line);color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.label{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:-.5px}
.unit{font-size:14px;font-weight:500;color:var(--mute);letter-spacing:0}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font-size:14px;color:var(--mute)}
.chg{font-variant-numeric:tabular-nums;font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--mute)}
.ratio .big{font-size:46px}
.spark{width:100%;height:64px;margin-top:10px;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--mute);text-align:right;padding:6px 0;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:8px 0;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.rng{display:flex;gap:6px;margin:2px 0 12px}
.rng button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-size:13px;padding:8px 0;border-radius:10px;min-height:38px}
.rng button[aria-pressed=true]{background:var(--line);color:var(--text)}
.ch-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.ch-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.ch-date{font-size:13px;color:var(--mute)}
svg.chart{width:100%;height:auto;display:block;margin-top:8px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ax{fill:var(--mute);font-size:10px}
.grid{stroke:var(--line);stroke-width:1}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.empty{text-align:center;padding:40px 12px;color:var(--mute)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.stale{background:#3a2a10;color:#f3c77a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
@media (prefers-color-scheme: light){.stale{background:#fbefd0;color:#7a5200}}
</style>
</head>
<body>
<header>
  <div>
    <h1>IBJA Gold &amp; Silver</h1>
    <div class="sub" id="asof">Loading…</div>
  </div>
  <div class="seg" role="group" aria-label="Session">
    <button id="bAM" aria-pressed="false">AM</button>
    <button id="bPM" aria-pressed="true">PM</button>
  </div>
</header>
<div id="app"></div>

<script>
const fmt = n => n.toLocaleString("en-IN", {maximumFractionDigits: 0});
const fmt2 = n => n.toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
let history = [], session = "pm";
try { session = localStorage.getItem("ibja-session") || "pm"; } catch (e) {}

// Pick the chosen session's value; fall back to the other one if it isn't published yet.
function pick(entry, key){
  const r = entry.rates[key]; if (!r) return null;
  const v = session === "pm" ? (r.pm ?? r.am) : (r.am ?? r.pm);
  return v ?? null;
}
const ratioOf = e => {            // gold per gram / silver per gram  (gold ₹/10g, silver ₹/kg)
  const g = pick(e, "gold999"), s = pick(e, "silver999");
  return g && s ? (g * 100) / s : null;
};
function delta(cur, prev, money=true){
  if (prev == null || cur == null) return `<span class="chg flat">—</span>`;
  const d = cur - prev, cls = d > 0 ? "up" : d < 0 ? "down" : "flat", arrow = d > 0 ? "▲" : d < 0 ? "▼" : "•";
  const pct = prev ? (d / prev * 100) : 0;
  return `<span class="chg ${cls}">${arrow} ${money ? fmt(Math.abs(d)) : Math.abs(d).toFixed(2)} (${Math.abs(pct).toFixed(2)}%)</span>`;
}
function spark(vals){
  const pts = vals.filter(v => v != null); if (pts.length < 2) return "";
  const w = 300, h = 64, min = Math.min(...pts), max = Math.max(...pts), span = (max - min) || 1;
  const xy = pts.map((v,i) => [i/(pts.length-1)*w, h-6-((v-min)/span)*(h-12)]);
  const d = xy.map((p,i) => (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Ratio trend, last ${pts.length} days">
    <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--gold)"/></svg>
    <div class="row"><span>Low ${min.toFixed(2)}</span><span>High ${max.toFixed(2)}</span></div>`;
}

let range = 30;
try { range = parseInt(localStorage.getItem("ibja-range") || "30", 10); } catch (e) {}
const charts = {};
const shortDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-IN", {day: "numeric", month: "short"});
function chartCard(key, title, color, pts, f, dec){
  // pts: [{date, v}] with v possibly null
  const P = pts.filter(p => p.v != null);
  if (P.length < 2) return `<div class="card"><div class="label"><span class="dot" style="background:${color}"></span>${title}</div>
    <div class="note" style="margin-top:10px">Needs at least 2 days of data. It builds up automatically each business day.</div></div>`;
  const W = 340, H = 170, L = 50, R = 10, T = 10, B = 24;
  let lo = Math.min(...P.map(p => p.v)), hi = Math.max(...P.map(p => p.v));
  const pad = (hi - lo) * 0.12 || hi * 0.01; lo -= pad; hi += pad;
  const X = i => L + (i / (P.length - 1)) * (W - L - R);
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const line = P.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const area = line + ` L${X(P.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const ticks = [0, .5, 1].map(t => lo + (hi - lo) * t);
  const grid = ticks.map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>
    <text class="ax" x="${L-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${f(v, dec)}</text>`).join("");
  const first = P[0], last = P[P.length-1], up = last.v >= first.v;
  charts[key] = {P, X, Y, f, dec, color};
  const chg = last.v - first.v, pct = first.v ? chg / first.v * 100 : 0;
  return `<div class="card"><div class="label"><span class="dot" style="background:${color}"></span>${title}</div>
    <div class="ch-head"><span class="ch-val" id="v-${key}">${f(last.v, dec)}</span><span class="ch-date" id="d-${key}">${shortDate(last.date)}</span></div>
    <div class="row"><span>${shortDate(first.date)} → ${shortDate(last.date)}</span><span class="chg ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${f(Math.abs(chg), dec)} (${Math.abs(pct).toFixed(2)}%)</span></div>
    <svg class="chart" data-key="${key}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}, ${P.length} days">
      ${grid}
      <path d="${area}" fill="${color}" fill-opacity=".12"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line id="cl-${key}" class="grid" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none;stroke:var(--mute)"/>
      <circle id="cd-${key}" r="4.5" fill="${color}" cx="${X(P.length-1).toFixed(1)}" cy="${Y(last.v).toFixed(1)}"/>
      <text class="ax" x="${L}" y="${H-6}">${shortDate(first.date)}</text>
      <text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${shortDate(last.date)}</text>
    </svg></div>`;
}
document.getElementById("app").addEventListener("pointermove", e => {
  const svg = e.target.closest && e.target.closest("svg.chart"); if (!svg) return;
  const c = charts[svg.dataset.key]; if (!c) return;
  const box = svg.getBoundingClientRect(), x = (e.clientX - box.left) / box.width * 340;
  let best = 0, bd = 1e9;
  c.P.forEach((p, i) => { const d = Math.abs(c.X(i) - x); if (d < bd) { bd = d; best = i; } });
  const p = c.P[best], k = svg.dataset.key;
  document.getElementById("v-" + k).textContent = c.f(p.v, c.dec);
  document.getElementById("d-" + k).textContent = shortDate(p.date);
  const cl = document.getElementById("cl-" + k), cd = document.getElementById("cd-" + k);
  cl.setAttribute("x1", c.X(best)); cl.setAttribute("x2", c.X(best)); cl.style.display = "";
  cd.setAttribute("cx", c.X(best)); cd.setAttribute("cy", c.Y(p.v));
});
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".rng button"); if (!b) return;
  range = parseInt(b.dataset.r, 10); try { localStorage.setItem("ibja-range", String(range)); } catch (err) {}
  render();
});
function render(){
  const app = document.getElementById("app");
  document.getElementById("bAM").setAttribute("aria-pressed", session === "am");
  document.getElementById("bPM").setAttribute("aria-pressed", session === "pm");
  if (!history.length){
    document.getElementById("asof").textContent = "No data yet";
    app.innerHTML = `<div class="card empty"><b>No rates saved yet</b>The daily update hasn't run. Trigger "Update IBJA rates" once in your GitHub repo's Actions tab.</div>`;
    return;
  }
  const t = history[history.length-1], p = history[history.length-2];
  const g = pick(t,"gold999"), s = pick(t,"silver999"), pg = p && pick(p,"gold999"), ps = p && pick(p,"silver999");
  const r = ratioOf(t), pr = p ? ratioOf(p) : null;
  const d = new Date(t.date + "T00:00:00");
  document.getElementById("asof").textContent = d.toLocaleDateString("en-IN", {weekday:"short", day:"numeric", month:"short", year:"numeric"});
  const ageDays = Math.floor((Date.now() - d.getTime()) / 864e5);
  const stale = ageDays > 3 ? `<div class="stale">Latest rate is from ${ageDays} days ago. IBJA doesn't publish on weekends or holidays, or the update may have failed.</div>` : "";
  const noPM = session === "pm" && t.rates.gold999 && t.rates.gold999.pm == null
    ? `<div class="note" style="margin:-4px 0 10px">PM rates aren't out yet, showing AM.</div>` : "";
  const last14 = history.slice(-14).reverse();
  const win = range ? history.slice(-range) : history;
  const inr = (v, d) => "₹" + v.toLocaleString("en-IN", {maximumFractionDigits: 0});
  const rt = (v, d) => v.toFixed(2);
  const chartsHtml = `<div class="rng" role="group" aria-label="Time range">` +
    [[7,"7D"],[30,"30D"],[90,"90D"],[0,"All"]].map(([n,l]) => `<button data-r="${n}" aria-pressed="${range===n}">${l}</button>`).join("") + `</div>` +
    chartCard("gold", "Gold 999 · per 10 g", "var(--gold)", win.map(e => ({date: e.date, v: pick(e, "gold999")})), inr, 0) +
    chartCard("silver", "Silver 999 · per kg", "var(--silver)", win.map(e => ({date: e.date, v: pick(e, "silver999")})), inr, 0) +
    chartCard("ratio", "Gold : Silver ratio", "var(--gold)", win.map(e => ({date: e.date, v: ratioOf(e)})), rt, 2);
  app.innerHTML = stale + noPM + `
  <div class="card ratio">
    <div class="label">Gold : Silver ratio</div>
    <div class="big">${r ? r.toFixed(2) : "—"}</div>
    <div class="row"><span>vs previous day</span>${delta(r, pr, false)}</div>
    ${spark(history.slice(-30).map(ratioOf))}
    <div class="note">Ounces of silver that buy one ounce of gold (Gold 999 ÷ Silver 999, last 30 days).</div>
  </div>
  <div class="card">
    <div class="label"><span class="dot" style="background:var(--gold)"></span>Gold 999</div>
    <div class="big">₹${g ? fmt(g) : "—"} <span class="unit">/ 10 g</span></div>
    <div class="row"><span>₹${g ? fmt2(g/10) : "—"} per gram</span>${delta(g, pg)}</div>
  </div>
  <div class="card">
    <div class="label"><span class="dot" style="background:var(--silver)"></span>Silver 999</div>
    <div class="big">₹${s ? fmt(s) : "—"} <span class="unit">/ kg</span></div>
    <div class="row"><span>₹${s ? fmt2(s/1000) : "—"} per gram</span>${delta(s, ps)}</div>
  </div>
  ${chartsHtml}
  <div class="card">
    <div class="label">Last 14 days (${session.toUpperCase()})</div>
    <table class="tbl"><thead><tr><th>Date</th><th>Gold /10g</th><th>Silver /kg</th><th>Ratio</th></tr></thead><tbody>
    ${last14.map(e => `<tr><td>${new Date(e.date+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</td>
      <td>${pick(e,"gold999") ? fmt(pick(e,"gold999")) : "—"}</td><td>${pick(e,"silver999") ? fmt(pick(e,"silver999")) : "—"}</td>
      <td>${ratioOf(e) ? ratioOf(e).toFixed(2) : "—"}</td></tr>`).join("")}
    </tbody></table>
  </div>
  <div class="note">Source: IBJA (ibjarates.com), excluding GST and making charges. Published on business days only.</div>`;
}
function setSession(s){ session = s; try { localStorage.setItem("ibja-session", s); } catch (e) {} render(); }
document.getElementById("bAM").onclick = () => setSession("am");
document.getElementById("bPM").onclick = () => setSession("pm");

fetch("data/rates.json", {cache: "no-cache"}).then(r => r.json()).then(j => { history = j.filter(e => e.v === 2); render(); })
  .catch(() => { document.getElementById("asof").textContent = "Couldn't load rates"; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
